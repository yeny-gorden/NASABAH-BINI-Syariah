<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BINI Syariah - Portal Layanan Nasabah</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Konfigurasi PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#059669">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between font-sans px-4 py-8">
  <div class="max-w-md w-full mx-auto space-y-6 my-auto">
    <div class="text-center space-y-3">
      <div class="w-20 h-20 bg-emerald-500/20 text-emerald-400 rounded-3xl flex items-center justify-center mx-auto text-3xl border-2 border-emerald-500/40 shadow-xl">
        <i class="fa-solid fa-moon"></i>
      </div>
      <h1 class="text-2xl font-black tracking-tight text-white">BINI SYARIAH</h1>
      <p class="text-sm text-emerald-300 font-medium">Suami Cari, Istri Menikmati</p>
    </div>

    <!-- Tombol Menu Utama -->
    <div id="authMenu" class="space-y-4 pt-2">
      <button type="button" onclick="showLogin()" class="w-full py-4 px-6 rounded-2xl bg-emerald-600 hover:bg-emerald-500 font-bold text-base shadow-xl shadow-emerald-600/30 transition flex items-center justify-center gap-3 cursor-pointer">
        <i class="fa-solid fa-right-to-bracket text-lg"></i> Masuk Akun Nasabah
      </button>
      <button type="button" onclick="showRegister()" class="w-full py-4 px-6 rounded-2xl bg-slate-900 border-2 border-slate-700 hover:bg-slate-800 font-bold text-base transition flex items-center justify-center gap-3 text-slate-200 cursor-pointer">
        <i class="fa-solid fa-user-plus text-lg text-amber-400"></i> Buka Rekening Baru
      </button>
    </div>

    <!-- Form Login -->
    <form id="formLogin" onsubmit="handleLoginSubmit(event)" class="space-y-4 bg-slate-900 border-2 border-slate-800 p-6 rounded-3xl shadow-2xl hidden">
      <h2 class="text-base font-bold text-emerald-400 text-center pb-2 border-b border-slate-800">Silakan Masuk</h2>
      <div>
        <label class="block text-sm font-bold text-slate-200 mb-2">No. HP / ID / No. Rekening</label>
        <input type="text" id="loginId" required placeholder="Contoh: 0812345 atau NSB-001" class="w-full bg-slate-950 border-2 border-slate-700 focus:border-emerald-500 rounded-2xl px-4 py-3.5 text-sm text-white focus:outline-none font-mono">
      </div>
      <div>
        <label class="block text-sm font-bold text-slate-200 mb-2">PIN Transaksi (6 Angka)</label>
        <input type="password" id="loginPin" required maxlength="6" inputmode="numeric" placeholder="••••••" class="w-full bg-slate-950 border-2 border-slate-700 focus:border-emerald-500 rounded-2xl px-4 py-3.5 text-base text-white tracking-[0.5em] text-center font-bold focus:outline-none">
      </div>
      <div id="loginStatus" class="text-xs text-center font-bold min-h-[20px]"></div>
      <div class="flex gap-3 pt-2">
        <button type="button" onclick="resetAuthView()" class="w-1/3 py-3.5 rounded-2xl bg-slate-800 text-slate-300 text-sm font-bold cursor-pointer">Kembali</button>
        <button type="submit" id="loginBtn" class="w-2/3 py-3.5 rounded-2xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm shadow-lg cursor-pointer">Masuk Sekarang</button>
      </div>
    </form>

    <!-- Form Registrasi -->
    <form id="formRegister" onsubmit="handleRegisterSubmit(event)" class="space-y-4 bg-slate-900 border-2 border-slate-800 p-6 rounded-3xl shadow-2xl hidden">
      <h2 class="text-base font-bold text-amber-400 text-center pb-2 border-b border-slate-800">Form Buka Rekening</h2>
      <div>
        <label class="block text-sm font-bold text-slate-200 mb-2">Nama Lengkap</label>
        <input type="text" id="regName" required placeholder="Nama sesuai KTP" class="w-full bg-slate-950 border-2 border-slate-700 focus:border-amber-500 rounded-2xl px-4 py-3.5 text-sm text-white focus:outline-none">
      </div>
      <div>
        <label class="block text-sm font-bold text-slate-200 mb-2">Alamat Tempat Tinggal</label>
        <input type="text" id="regAddress" required placeholder="Nama jalan / Perumahan / Desa" class="w-full bg-slate-950 border-2 border-slate-700 focus:border-amber-500 rounded-2xl px-4 py-3.5 text-sm text-white focus:outline-none">
      </div>
      <div>
        <label class="block text-sm font-bold text-slate-200 mb-2">Nomor WhatsApp Aktif</label>
        <div class="flex gap-2">
          <select id="regCountryCode" class="bg-slate-950 border-2 border-slate-700 rounded-2xl px-3 py-3.5 text-sm text-white font-mono focus:outline-none">
            <option value="+62">+62 (ID)</option>
            <option value="+60">+60 (MY)</option>
            <option value="+65">+65 (SG)</option>
            <option value="+673">+673 (BN)</option>
          </select>
          <input type="tel" id="regPhone" required inputmode="numeric" placeholder="81234567890" class="w-full bg-slate-950 border-2 border-slate-700 rounded-2xl px-4 py-3.5 text-sm text-white font-mono focus:outline-none">
        </div>
      </div>
      <div>
        <label class="block text-sm font-bold text-slate-200 mb-2">Buat PIN (6 Angka)</label>
        <input type="password" id="regPin" required maxlength="6" inputmode="numeric" placeholder="••••••" class="w-full bg-slate-950 border-2 border-slate-700 focus:border-amber-500 rounded-2xl px-4 py-3.5 text-base text-white tracking-[0.5em] text-center font-bold focus:outline-none">
      </div>
      <div id="registerStatus" class="text-xs text-center font-bold min-h-[20px]"></div>
      <div class="flex gap-3 pt-2">
        <button type="button" onclick="resetAuthView()" class="w-1/3 py-3.5 rounded-2xl bg-slate-800 text-slate-300 text-sm font-bold cursor-pointer">Kembali</button>
        <button type="submit" id="registerBtn" class="w-2/3 py-3.5 rounded-2xl bg-amber-600 hover:bg-amber-500 text-white font-bold text-sm shadow-lg cursor-pointer">Daftar Sekarang</button>
      </div>
    </form>
  </div>

  <!-- Custom Alert Modal -->
  <div id="customAlertModal" class="fixed inset-0 bg-black/85 backdrop-blur-sm z-[100] hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border-2 border-emerald-500/50 w-full max-w-xs rounded-3xl p-6 shadow-2xl text-center space-y-4">
      <div class="w-14 h-14 rounded-2xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center mx-auto text-2xl border border-emerald-500/30">
        <i class="fa-solid fa-circle-check"></i>
      </div>
      <div class="space-y-1.5">
        <h3 id="customAlertTitle" class="text-base font-black text-white">Pemberitahuan</h3>
        <p id="customAlertMessage" class="text-xs text-slate-300 whitespace-pre-line leading-relaxed"></p>
      </div>
      <button type="button" onclick="closeCustomAlert()" class="w-full py-3.5 rounded-2xl bg-emerald-600 hover:bg-emerald-500 text-white font-black text-xs shadow-lg transition cursor-pointer">
        Mengerti
      </button>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw5jTLvsc9nKsVikolWzQk1n9mUCFKNOCu0Evzwt4R3gN5528jVPEiwU2JyrmjTs2xd/exec";

    function showCustomAlert(message, title = 'Pemberitahuan') {
      document.getElementById('customAlertTitle').textContent = title;
      document.getElementById('customAlertMessage').textContent = message;
      document.getElementById('customAlertModal').classList.remove('hidden');
    }

    function closeCustomAlert() {
      document.getElementById('customAlertModal').classList.add('hidden');
    }

    function showLogin() {
      document.getElementById('authMenu').classList.add('hidden');
      document.getElementById('formLogin').classList.remove('hidden');
    }

    function showRegister() {
      document.getElementById('authMenu').classList.add('hidden');
      document.getElementById('formRegister').classList.remove('hidden');
    }

    function resetAuthView() {
      document.getElementById('authMenu').classList.remove('hidden');
      document.getElementById('formLogin').classList.add('hidden');
      document.getElementById('formRegister').classList.add('hidden');
    }

    async function handleLoginSubmit(e) {
      e.preventDefault();
      const inputVal = document.getElementById('loginId').value.trim();
      const pin = document.getElementById('loginPin').value.trim();
      const statusEl = document.getElementById('loginStatus');
      const btn = document.getElementById('loginBtn');
      
      btn.disabled = true;
      btn.textContent = 'Memeriksa Data...';
      statusEl.textContent = '';

      try {
        const res = await fetch(SCRIPT_URL + '?action=getAllData');
        const data = await res.json();
        if (data.status === 'success') {
          const cleanInput = inputVal.toUpperCase();

          const found = data.nasabah.find(n => {
            const dbId = String(n.ID_Nasabah || '').trim().toUpperCase();
            const dbAcc = String(n.No_Rekening || '').trim();
            const dbPhone = String(n.Telepon_WA || '').trim();
            
            const matchIdOrAcc = (dbId === cleanInput || dbAcc === cleanInput);
            const matchPhone = (dbPhone === cleanInput || dbPhone.endsWith(cleanInput) || dbPhone.replace('+', '') === cleanInput.replace('+', ''));

            return (matchIdOrAcc || matchPhone);
          });

          if (found && String(found.PIN).trim() === pin) {
            localStorage.setItem('currentNasabah', JSON.stringify(found));
            window.location.href = 'nasabah.html';
            return;
          }
        }
        statusEl.textContent = 'No. HP, ID, No. Rekening, atau PIN salah!';
        statusEl.className = 'text-xs text-center text-red-400 font-bold';
      } catch(err) {
        statusEl.textContent = 'Gagal tersambung ke jaringan.';
        statusEl.className = 'text-xs text-center text-red-400 font-bold';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Masuk Sekarang';
      }
    }

    async function handleRegisterSubmit(e) {
      e.preventDefault();
      const name = document.getElementById('regName').value.trim();
      const address = document.getElementById('regAddress').value.trim();
      const countryCode = document.getElementById('regCountryCode').value;
      const rawPhone = document.getElementById('regPhone').value.trim();
      const phone = countryCode + (rawPhone.startsWith('0') ? rawPhone.slice(1) : rawPhone);
      const pin = document.getElementById('regPin').value.trim();
      const statusEl = document.getElementById('registerStatus');
      const btn = document.getElementById('registerBtn');

      btn.disabled = true;
      btn.textContent = 'Memproses Pendaftaran...';

      const id = 'NSB-' + Math.floor(100 + Math.random() * 900);
      const acc = '777' + Math.floor(10000000 + Math.random() * 90000000);
      const refCode = 'REG-' + Date.now().toString().slice(-6);
      const dateStr = new Date().toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
      const timestamp = new Date().toISOString();

      try {
        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({
            action: 'registerNasabah',
            data: { id, name, address, phone, pin, acc, balance: 0, refCode, dateStr, timestamp, statusAkun: 'AKTIF' }
          })
        });
        const result = await res.json();
        if (result.status === 'success') {
          showCustomAlert("No. Rekening Anda: " + acc + "\nID Nasabah: " + id + "\n\nSilakan gunakan No. HP / ID / No. Rekening tersebut untuk Masuk.", 'Pendaftaran Berhasil!');
          resetAuthView();
          e.target.reset();
        } else {
          statusEl.textContent = 'Pendaftaran gagal dilakukan.';
          statusEl.className = 'text-xs text-center text-red-400 font-bold';
        }
      } catch(err) {
        statusEl.textContent = 'Kesalahan jaringan.';
        statusEl.className = 'text-xs text-center text-red-400 font-bold';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Daftar Sekarang';
      }
    }
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/firebase-messaging-sw.js')
          .then((reg) => {
            console.log('Service Worker terdaftar dengan sukses:', reg.scope);
          })
          .catch((err) => {
            console.log('Pendaftaran Service Worker gagal:', err);
          });
      });
    }
  </script>
</body>
</html>
