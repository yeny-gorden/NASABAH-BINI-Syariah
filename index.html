<!DOCTYPE html>
<html lang="id" class="dark">

<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Login - BINI SYARIAH (Tabungan Suami Kesayangan Mamah)</title>
 <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
 <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body class="bg-slate-950 text-slate-100 antialiased min-h-screen flex items-center justify-center p-4">
 <div class="w-full max-w-md bg-slate-900 border border-orange-500/30 rounded-3xl p-7 shadow-2xl relative overflow-hidden animate-card">
  <!-- Header Logo BINI Syariah -->
  <div class="text-center mb-6">
   <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-orange-600 to-amber-500 flex items-center justify-center text-white font-extrabold text-2xl tracking-tighter mx-auto mb-3 shadow-lg shadow-orange-500/30 border border-orange-400/40">
    69
   </div>
   <h1 class="text-base font-extrabold text-white tracking-tight">BINI <span class="text-orange-400">SYARIAH</span></h1>
   <p class="text-[11px] text-orange-300 font-semibold tracking-wider mt-0.5 uppercase">Tabungan Suami Kesayangan Mamah</p>
  </div>
  <!-- Tab Navigasi (Masuk vs Buat Akun) -->
  <div class="grid grid-cols-2 gap-1 p-1 bg-slate-950 rounded-2xl border border-slate-800 mb-6">
   <button type="button" id="tabLoginBtn" onclick="switchAuthTab('login')" class="py-2.5 rounded-xl text-xs font-bold transition bg-orange-600 text-white shadow">
Masuk Akun
</button>
   <button type="button" id="tabRegisterBtn" onclick="switchAuthTab('register')" class="py-2.5 rounded-xl text-xs font-bold transition text-slate-400 hover:text-white">
Buat Akun Baru
</button>
  </div>
  <!-- FORM 1: LOGIN NASABAH -->
  <form id="formLogin" onsubmit="handleLoginSubmit(event)" class="space-y-4">
   <div>
    <label class="block text-xs font-semibold text-slate-300 mb-1.5">ID Nasabah</label>
    <div class="flex items-center bg-slate-950 border border-slate-700 focus-within:border-orange-500 rounded-xl overflow-hidden">
     <span class="pl-3.5 pr-1 py-3 text-xs font-mono font-extrabold text-orange-400 select-none">NSB-</span>
     <input type="text" id="loginId" required maxlength="5" inputmode="numeric" placeholder="001" class="w-full bg-transparent pr-3.5 py-3 text-xs text-white uppercase font-mono focus:outline-none">
    </div>
   </div>
   <div>
    <label class="block text-xs font-semibold text-slate-300 mb-1.5">PIN Transaksi (6 Digit)</label>
    <input type="password" id="loginPin" required maxlength="6" inputmode="numeric" placeholder="••••••" class="w-full bg-slate-950 border border-slate-700 focus:border-orange-500 rounded-xl px-3.5 py-3 text-xs text-white tracking-[0.5em] text-center font-bold focus:outline-none">
   </div>
   <div id="loginStatus" class="text-[11px] text-center font-medium min-h-[16px]"></div>
   <button type="submit" id="loginBtn" class="w-full py-3.5 rounded-2xl bg-orange-600 hover:bg-orange-500 text-white font-bold text-xs shadow-lg shadow-orange-600/30 transition">
Masuk ke Aplikasi
</button>
  </form>
  <!-- FORM 2: BUAT AKUN BARU NASABAH -->
  <form id="formRegister" onsubmit="handleRegisterSubmit(event)" class="space-y-4 hidden">
   <div>
    <label class="block text-xs font-semibold text-slate-300 mb-1.5">Nama Lengkap</label>
    <input type="text" id="regName" required placeholder="Nama lengkap sesuai identitas" class="w-full bg-slate-950 border border-slate-700 focus:border-orange-500 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none">
   </div>
   <div>
    <label class="block text-xs font-semibold text-slate-300 mb-1.5">Alamat Domisili / Rumah Mamah</label>
    <input type="text" id="regAddress" required placeholder="Contoh: Jl. Bahagia No. 69" class="w-full bg-slate-950 border border-slate-700 focus:border-orange-500 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none">
   </div>
   <div>
    <label class="block text-xs font-semibold text-slate-300 mb-1.5">Nomor HP / WhatsApp Aktif</label>
    <input type="tel" id="regPhone" required inputmode="numeric" placeholder="Contoh: 081234567890" class="w-full bg-slate-950 border border-slate-700 focus:border-orange-500 rounded-xl px-3.5 py-2.5 text-xs text-white font-mono focus:outline-none">
   </div>
   <div>
    <label class="block text-xs font-semibold text-slate-300 mb-1.5">Buat PIN Transaksi (6 Digit)</label>
    <input type="password" id="regPin" required maxlength="6" inputmode="numeric" placeholder="••••••" class="w-full bg-slate-950 border border-slate-700 focus:border-orange-500 rounded-xl px-3.5 py-2.5 text-xs text-white tracking-[0.5em] text-center font-bold focus:outline-none">
   </div>
   <div id="registerStatus" class="text-[11px] text-center font-medium min-h-[16px]"></div>
   <button type="submit" id="registerBtn" class="w-full py-3.5 rounded-2xl bg-amber-600 hover:bg-amber-500 text-white font-bold text-xs shadow-lg shadow-amber-600/30 transition">
Daftar Akun Baru
</button>
  </form>
 </div>
</body>

<style>body { font-family: 'Inter', sans-serif; background-color: #020617; }
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-card { animation: fadeSlideUp 0.4s ease-out forwards; }
/* Menyembunyikan badge atau watermark Netlify */
.netlify-badge, 
a[href*="netlify.com/?utm_source"],
iframe#netlify-badge-iframe {
    display: none !important;
    visibility: hidden !important;
    opacity: 0 !important;
    pointer-events: none !important;
}
</style><script>// URL WEB APP GOOGLE APPS SCRIPT (HARUS SAMA PERSIS DENGAN ADMIN.HTML & NASABAH.HTML)
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwu0kGhiGxqD1wH5MeqWxIDMfep_SsTLYkpYMnjwzGJNu2kUPAW8T83SL2C1t52CH9r/exec";

        function normalizeCustomerId(rawInput) {
            let clean = String(rawInput || '').trim().toUpperCase();
            if (clean.startsWith('NSB-')) {
                clean = clean.replace('NSB-', '');
            }
            return clean ? 'NSB-' + clean : '';
        }

        function switchAuthTab(tab) {
            const loginForm = document.getElementById('formLogin');
            const regForm = document.getElementById('formRegister');
            const loginBtn = document.getElementById('tabLoginBtn');
            const regBtn = document.getElementById('tabRegisterBtn');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                regForm.classList.add('hidden');
                loginBtn.className = "py-2.5 rounded-xl text-xs font-bold transition bg-orange-600 text-white shadow";
                regBtn.className = "py-2.5 rounded-xl text-xs font-bold transition text-slate-400 hover:text-white";
            } else {
                loginForm.classList.add('hidden');
                regForm.classList.remove('hidden');
                regBtn.className = "py-2.5 rounded-xl text-xs font-bold transition bg-amber-600 text-white shadow";
                loginBtn.className = "py-2.5 rounded-xl text-xs font-bold transition text-slate-400 hover:text-white";
            }
        }

        // Handle Proses Login Nasabah (Sinkron dengan Kolom Google Sheets)
        async function handleLoginSubmit(e) {
            e.preventDefault();
            const fullId = normalizeCustomerId(document.getElementById('loginId').value);
            const pin = document.getElementById('loginPin').value.trim();
            const status = document.getElementById('loginStatus');
            const btn = document.getElementById('loginBtn');

            status.style.color = "#f97316";
            status.textContent = "Memverifikasi ke Google Sheets...";
            btn.disabled = true;

            try {
                const res = await fetch(`${SCRIPT_URL}?action=getAllData`);
                const result = await res.json();

                if (result.status === 'success') {
                    const nasabahList = result.nasabah || [];
                    const found = nasabahList.find(n => 
                        String(n.ID_Nasabah).trim().toUpperCase() === fullId && 
                        String(n.PIN).trim() === String(pin)
                    );

                    if (found) {
                        sessionStorage.setItem('nusa_nasabah_session', found.ID_Nasabah);
                        status.style.color = "#34d399";
                        status.textContent = `Selamat datang, ${found.Nama}! Membuka dashboard...`;
                        setTimeout(() => { window.location.href = "nasabah.html"; }, 700);
                    } else {
                        status.style.color = "#fb7185";
                        status.textContent = "ID Nasabah atau PIN salah!";
                        btn.disabled = false;
                    }
                } else {
                    status.style.color = "#fb7185";
                    status.textContent = result.message || "Gagal memuat data database.";
                    btn.disabled = false;
                }
            } catch (err) {
                status.style.color = "#fb7185";
                status.textContent = "Gagal terhubung ke Google Sheets. Periksa URL Script.";
                btn.disabled = false;
            }
        }

        // Handle Pendaftaran Akun Baru Nasabah (Format Identik dengan Admin.html)
        async function handleRegisterSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('regName').value.trim();
            const address = document.getElementById('regAddress').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const pin = document.getElementById('regPin').value.trim();
            const status = document.getElementById('registerStatus');
            const btn = document.getElementById('registerBtn');

            status.style.color = "#f97316";
            status.textContent = "Mendaftarkan rekening ke Google Sheets...";
            btn.disabled = true;

            try {
                // Ambil jumlah nasabah terbaru agar penomoran ID_Nasabah tidak bentrok
                const checkRes = await fetch(`${SCRIPT_URL}?action=getAllData`);
                const checkData = await checkRes.json();
                const existingCount = (checkData.nasabah || []).length;

                const newId = 'NSB-' + String(existingCount + 1).padStart(3, '0');
                const newAcc = '8801 ' + Math.floor(1000 + Math.random() * 9000) + ' ' + Math.floor(10 + Math.random() * 90);

                const now = new Date();
                const months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
                const dateStr = `${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;
                const refCode = 'REG-' + Date.now().toString().slice(-8);

                const payloadData = {
                    id: newId,
                    name: name,
                    address: address,
                    phone: phone,
                    pin: pin,
                    acc: newAcc,
                    balance: 0,
                    dateStr: dateStr,
                    month: String(now.getMonth() + 1).padStart(2, '0'),
                    year: String(now.getFullYear()),
                    timestamp: Math.floor(Date.now() / 1000),
                    refCode: refCode
                };

                const res = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'registerNasabah', data: payloadData })
                });
                const result = await res.json();

                if (result.status === 'success') {
                    status.style.color = "#34d399";
                    status.textContent = `Berhasil! ID Anda: ${newId}. Silakan masuk.`;
                    document.getElementById('loginId').value = newId.replace('NSB-', '');
                    setTimeout(() => {
                        switchAuthTab('login');
                        document.getElementById('formRegister').reset();
                        btn.disabled = false;
                        status.textContent = "";
                    }, 1800);
                } else {
                    status.style.color = "#fb7185";
                    status.textContent = result.message || "Pendaftaran gagal.";
                    btn.disabled = false;
                }
            } catch (err) {
                status.style.color = "#fb7185";
                status.textContent = "Gagal terhubung ke Google Sheets.";
                btn.disabled = false;
            }
        }</script></html>
